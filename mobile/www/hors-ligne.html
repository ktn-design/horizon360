<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Horizon 360</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0f172a; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 24px; line-height: 1.5; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <img src="logo.png" alt="" />
    <h1>Pas de connexion internet</h1>
    <p>Horizon 360 a besoin d'internet pour afficher les hotels, maisons et salles.<br />Verifiez votre connexion puis reessayez.<br /><br />No internet connection. Please check your connection and try again.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Reessayer / Retry</button>
  </div>
</body>
</html>
